<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quilon Vehicles & Parts</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #fef08a; color: #333; }
        
        .banner-header-container { position: relative; width: 100%; height: 220px; background: #000; }
        .banner-header-container img { width: 100%; height: 220px; object-fit: cover; display: block; opacity: 0.9; }
        
        .top-menu-bar { position: absolute; top: 15px; right: 20px; z-index: 3000; }
        .menu-icon { font-size: 24px; cursor: pointer; padding: 6px 14px; background: rgba(0, 0, 0, 0.7); color: white; border-radius: 5px; user-select: none; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .dropdown-menu { display: none; position: fixed; top: 65px; right: 20px; background: #ffffff !important; color: #333; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); width: 280px; z-index: 999999; padding: 15px; max-height: 82vh; overflow-y: auto; border: 2px solid #333; }
        .dropdown-menu.active { display: block; }
        .dropdown-menu label { font-size: 13px; font-weight: bold; margin-top: 12px; display: block; color: #555; background: #ffffff !important; border: none; padding: 0; }
        .dropdown-menu select, .dropdown-menu input { background: #ffffff !important; border: 1px solid #cbd5e1; outline: none; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #dcfce7; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid #bbf7d0; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 22px; cursor: pointer; font-weight: bold; color: #333; }

        .notice-box { background: #fef3c7; border: 1px solid #f59e0b; color: #b45309; padding: 10px; border-radius: 5px; font-size: 13px; font-weight: bold; margin: 10px 0; text-align: center; }

        .container { padding: 20px 20px 80px 20px; max-width: 1200px; margin: auto; }
        .search-container { background: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; background: #ffffff; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #16a34a; box-shadow: none; }
        
        button { background: #16a34a; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #15803d; }

        .loc-btn { background: #2563eb; font-size: 12px; padding: 6px 10px; margin-bottom: 8px; width: auto; display: inline-block; }
        .loc-btn:hover { background: #1d4ed8; }

        .delete-btn { background: #dc2626 !important; margin-top: 10px; font-size: 13px; padding: 8px 12px; width: 100%; display: block; text-align: center; }
        .delete-btn:hover { background: #b91c1c !important; }
        
        .post-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .post-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.08); padding: 15px; position: relative; }
        .post-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; background-color: #ddd; }
        .price { color: #047857; font-size: 18px; font-weight: bold; }
        .fav-btn { position: absolute; top: 20px; right: 20px; background: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
        .suggestion-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; max-height: 150px; overflow-y: auto; z-index: 300000; border-radius: 0 0 5px 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .menu-btn-action { background: #2563eb; color: white; margin-bottom: 10px; text-align: center; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .menu-btn-action:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="banner-header-container">
        <img src="file_00000000f648820895b49c4bf4868e39.png" alt="Quilon Vehicles Banner" onerror="this.style.display='none'">
        
        <div class="top-menu-bar">
            <div class="menu-icon" onclick="toggleDropdown(event)">⋮</div>
            <div id="dropdownMenu" class="dropdown-menu">
                <div class="menu-btn-action" onclick="openPostModal()" id="lblPostBtn">+ Post Your Ad</div>

                <label id="lblLangTitle">Select Language</label>
                <select id="languageSelect" onchange="changeLanguage()" style="margin-top: 5px;">
                    <option value="en">English</option>
                    <option value="ml">മലയാളം (Malayalam)</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                </select>

                <label id="lblLocFilterTitle">Filter by Location (All India)</label>
                <div style="position: relative; margin-top: 5px;">
                    <input type="text" id="locationFilter" placeholder="Enter any city or state..." onkeyup="filterPosts()" autocomplete="off" style="margin: 0;">
                </div>

                <label id="lblCatFilterTitle">Category Filter</label>
                <select id="categoryFilter" onchange="filterPosts()" style="margin-top: 5px;">
                    <option value="">All Categories</option>
                    <option value="Bike">Bikes</option>
                    <option value="Car">Cars</option>
                    <option value="Auto">Autos</option>
                    <option value="Part">Body Parts</option>
                </select>

                <label id="lblPriceFilterTitle">Price Filter</label>
                <select id="priceFilter" onchange="filterPosts()" style="margin-top: 5px;">
                    <option value="">All Prices</option>
                    <option value="20k">Under ₹20,000</option>
                    <option value="1lakh">Under ₹1 Lakh</option>
                    <option value="5lakhs">Under ₹5 Lakhs</option>
                </select>

                <label id="lblFuelFilterTitle">Fuel Type</label>
                <select id="fuelFilter" onchange="filterPosts()" style="margin-top: 5px;">
                    <option value="">All Fuel Types</option>
                    <option value="petrol">Petrol</option>
                    <option value="diesel">Diesel</option>
                    <option value="ev">Electric (EV)</option>
                    <option value="cng">CNG</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container" style="padding-bottom: 0px; padding-top: 20px;">
        <div class="search-container">
            <h3 id="txtSearchFilter" style="margin-top: 0; margin-bottom: 8px;">Search Vehicles & Body Parts</h3>
            <div style="position: relative; width: 100%;">
                <input type="text" id="searchInput" placeholder="Search vehicles or parts..." onkeyup="handleSearchInput()" autocomplete="off" style="margin: 0;">
                <div id="searchSuggestions" class="suggestion-box"></div>
            </div>
        </div>
    </div>

    <!-- Post Ad Modal (Popup) -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePostModal()">&times;</span>
            <h3 id="txtPostAd" style="margin-top:0;">Post Your Ad</h3>
            
            <div id="notice30Days" class="notice-box">
                ⚠️ Note: From today onwards, this vehicle ad will remain active on this site for 30 days only.
            </div>

            <input type="text" id="postTitle" placeholder="Vehicle / Part Name">
            
            <select id="postCategory" onchange="updateFeesText()">
                <option value="Bike">Bike (Posting Fee: ₹20 / Unlock: ₹20)</option>
                <option value="Car">Car (Posting Fee: ₹20 / Unlock: ₹30)</option>
                <option value="Auto">Auto (Posting Fee: ₹30 / Unlock: ₹30)</option>
                <option value="Part">Body Part (Posting Fee: ₹20 / Unlock: ₹20)</option>
            </select>

            <select id="postFuel">
                <option value="petrol">Petrol</option>
                <option value="diesel">Diesel</option>
                <option value="ev">Electric (EV)</option>
                <option value="cng">CNG</option>
            </select>

            <input type="number" id="postPrice" placeholder="Price in ₹">
            
            <div>
                <label id="lblLocationPrompt" style="font-size: 13px; font-weight: bold; margin-top: 8px; display: block;">Location</label>
                <button type="button" class="loc-btn" id="btnGetLoc" onclick="fetchCurrentLocation()">📍 Use My Current Location</button>
                <input type="text" id="vehicleLocation" placeholder="Enter city or use GPS button above" style="margin-top: 0;">
            </div>

            <input type="file" id="postImage" accept="image/*">
            <textarea id="postContact" placeholder="Contact Details"></textarea>
            <button onclick="submitPost()" id="btnSubmit" style="margin-top: 10px;">Publish Ad (Pay ₹20)</button>
        </div>
    </div>

    <div class="container">
        <h2 id="txtRecentPosts">Latest Posts</h2>
        <div class="post-grid" id="postsContainer"></div>
    </div>

    <script>
        const translations = {
            en: {
                postBtn: "+ Post Your Ad",
                langTitle: "Select Language",
                locFilterTitle: "Filter by Location (All India)",
                catFilterTitle: "Category Filter",
                priceFilterTitle: "Price Filter",
                fuelFilterTitle: "Fuel Type",
                searchFilterTitle: "Search Vehicles & Body Parts",
                searchPlaceholder: "Search vehicles or parts...",
                recentPosts: "Latest Posts",
                postAdTitle: "Post Your Ad",
                noticeText: "⚠️ Note: From today onwards, this vehicle ad will remain active on this site for 30 days only.",
                locBtnText: "📍 Use My Current Location",
                locPlaceholder: "Enter city or use GPS button above",
                noPosts: "No posts found. Be the first one to post!",
                categoryLabel: "Category",
                fuelLabel: "Fuel",
                mapText: "View on Map",
                unlockBtn: "Unlock Contact",
                deleteBtnText: "🗑️ Delete Post"
            },
            ml: {
                postBtn: "+ പരസ്യം പോസ്റ്റ് ചെയ്യുക",
                langTitle: "ഭാഷ തിരഞ്ഞെടുക്കുക",
                locFilterTitle: "സ്ഥലം അനുസരിച്ച് ഫിൽട്ടർ ചെയ്യുക",
                catFilterTitle: "കാറ്റഗറി ഫിൽട്ടർ",
                priceFilterTitle: "വില ഫിൽട്ടർ",
                fuelFilterTitle: "ഇന്ധന തരം",
                searchFilterTitle: "വാഹനങ്ങളും പാർട്സുകളും തിരയുക",
                searchPlaceholder: "വാഹനങ്ങൾ അല്ലെങ്കിൽ പാർട്സുകൾ തിരയുക...",
                recentPosts: "ഏറ്റവും പുതിയ പരസ്യങ്ങൾ",
                postAdTitle: "നിങ്ങളുടെ പരസ്യം പോസ്റ്റ് ചെയ്യുക",
                noticeText: "⚠️ ശ്രദ്ധിക്കുക: ഇന്നു മുതൽ 30 ദിവസത്തേക്ക് മാത്രമായിരിക്കും ഈ വാഹനം ഈ സൈറ്റിൽ ഉണ്ടായിരിക്കുക.",
                locBtnText: "📍 എന്റെ നിലവിലെ സ്ഥലം എടുക്കുക",
                locPlaceholder: "സ്ഥലം നൽകുക അല്ലെങ്കിൽ GPS ഉപയോഗിക്കുക",
                noPosts: "പരസ്യങ്ങളൊന്നും കണ്ടെത്തിയില്ല. ആദ്യമായി പോസ്റ്റ് ചെയ്യൂ!",
                categoryLabel: "കാറ്റഗറി",
                fuelLabel: "ഇന്ധനം",
                mapText: "മാപ്പിൽ കാണുക",
                unlockBtn: "നമ്പർ അൺലോക്ക് ചെയ്യുക",
                deleteBtnText: "🗑️ പരസ്യം ഡിലീറ്റ് ചെയ്യുക"
            },
            hi: {
                postBtn: "+ अपना विज्ञापन पोस्ट करें",
                langTitle: "भाषा चुनिए",
                locFilterTitle: "स्थान के अनुसार फ़िल्टर करें",
                catFilterTitle: "श्रेणी फ़िल्टर",
                priceFilterTitle: "मूल्य फ़िल्टर",
                fuelFilterTitle: "ईंधन का प्रकार",
                searchFilterTitle: "वाहन और पार्ट्स खोजें",
                searchPlaceholder: "वाहन या पार्ट्स खोजें...",
                recentPosts: "नवीनतम विज्ञापन",
                postAdTitle: "अपना विज्ञापन पोस्ट करें",
                noticeText: "⚠️ ध्यान दें: आज से यह वाहन विज्ञापन केवल 30 दिनों के लिए इस साइट पर रहेगा।",
                locBtnText: "📍 मेरा वर्तमान स्थान उपयोग करें",
                locPlaceholder: "शहर दर्ज करें या GPS बटन दबाएं",
                noPosts: "कोई विज्ञापन नहीं मिला। पहले पोस्ट करें!",
                categoryLabel: "श्रेणी",
                fuelLabel: "ईंधन",
                mapText: "मानचित्र पर देखें",
                unlockBtn: "संपर्क अनलॉक करें",
                deleteBtnText: "🗑️ विज्ञापन हटाएं"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('languageSelect').value;
            localStorage.setItem('quilon_lang', lang);
            applyTranslations(lang);
        }

        function applyTranslations(lang) {
            const t = translations[lang] || translations.en;
            document.getElementById('lblPostBtn').innerText = t.postBtn;
            document.getElementById('lblLangTitle').innerText = t.langTitle;
            document.getElementById('lblLocFilterTitle').innerText = t.locFilterTitle;
            document.getElementById('lblCatFilterTitle').innerText = t.catFilterTitle;
            document.getElementById('lblPriceFilterTitle').innerText = t.priceFilterTitle;
            document.getElementById('lblFuelFilterTitle').innerText = t.fuelFilterTitle;
            document.getElementById('txtSearchFilter').innerText = t.searchFilterTitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('txtRecentPosts').innerText = t.recentPosts;
            document.getElementById('txtPostAd').innerText = t.postAdTitle;
            document.getElementById('notice30Days').innerText = t.noticeText;
            document.getElementById('btnGetLoc').innerText = t.locBtnText;
            document.getElementById('vehicleLocation').placeholder = t.locPlaceholder;
            filterPosts();
        }

        function fetchCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const data = await response.json();
                        const city = data.address.city || data.address.town || data.address.village || data.address.state_district || "Unknown Location";
                        document.getElementById('vehicleLocation').value = city;
                    } catch (e) {
                        alert("Could not fetch address automatically. Please type manually.");
                    }
                }, function(error) {
                    alert("Location permission denied or unavailable. Please enable GPS.");
                });
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        function toggleDropdown(event) {
            event.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('active');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-icon') && !event.target.closest('.dropdown-menu')) {
                const dropdown = document.getElementById('dropdownMenu');
                if (dropdown && dropdown.classList.contains('active')) {
                    dropdown.classList.remove('active');
                }
            }
        }

        function openPostModal() {
            document.getElementById('postModal').classList.add('active');
            document.getElementById('dropdownMenu').classList.remove('active');
        }

        function closePostModal() {
            document.getElementById('postModal').classList.remove('active');
        }

        function handleSearchInput() {
            filterPosts();
        }

        function updateFeesText() {
            const cat = document.getElementById('postCategory').value;
            const btn = document.getElementById('btnSubmit');
            const lang = document.getElementById('languageSelect').value;
            if(cat === 'Auto') {
                btn.innerText = lang === 'ml' ? "പരസ്യം പ്രസിദ്ധീകരിക്കുക (₹30 നൽകുക)" : (lang === 'hi' ? "विज्ञापन प्रकाशित करें (₹30 भुगतान करें)" : "Publish Ad (Pay ₹30)");
            } else {
                btn.innerText = lang === 'ml' ? "പരസ്യം പ്രസിദ്ധീകരിക്കുക (₹20 നൽകുക)" : (lang === 'hi' ? "विज्ञापन प्रकाशित करें (₹20 भुगतान करें)" : "Publish Ad (Pay ₹20)");
            }
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('quilon_lang') || 'en';
            document.getElementById('languageSelect').value = savedLang;
            applyTranslations(savedLang);
        };

        function submitPost() {
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('postCategory').value;
            const fuel = document.getElementById('postFuel').value;
            const price = Number(document.getElementById('postPrice').value);
            const locationVal = document.getElementById('vehicleLocation').value;
            const contact = document.getElementById('postContact').value;
            const imageInput = document.getElementById('postImage');

            if(!title || !price || !locationVal) {
                alert("Please fill all required fields!");
                return;
            }

            let postFee = (category === 'Auto') ? 30 : 20;

            if(imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    savePostData(title, category, fuel, price, locationVal, contact, e.target.result, postFee);
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                savePostData(title, category, fuel, price, locationVal, contact, '', postFee);
            }
        }

        function savePostData(title, category, fuel, price, locationVal, contact, image, postFee) {
            let posts = JSON.parse(localStorage.getItem('quilon_posts')) || [];
            
            const newPost = {
                id: Date.now(),
                title, category, fuel, price, location: locationVal, contact, image,
                date: new Date().getTime()
            };
            posts.unshift(newPost);
            localStorage.setItem('quilon_posts', JSON.stringify(posts));
            
            alert(`Ad Posted Successfully!`);
            window.location.reload();
        }

        function deletePost(postId) {
            if (confirm("Are you sure you want to delete this post?")) {
                let posts = JSON.parse(localStorage.getItem('quilon_posts')) || [];
                posts = posts.filter(p => p.id !== postId);
                localStorage.setItem('quilon_posts', JSON.stringify(posts));
                filterPosts();
            }
        }

        function toggleFavorite(postId) {
            let favorites = JSON.parse(localStorage.getItem('quilon_favorites')) || [];
            const index = favorites.indexOf(postId);
            if (index > -1) { favorites.splice(index, 1); } else { favorites.push(postId); }
            localStorage.setItem('quilon_favorites', JSON.stringify(favorites));
            filterPosts();
        }

        function unlockContact(postId, category) {
            let unlocked = JSON.parse(localStorage.getItem('quilon_unlocked')) || [];
            let unlockFee = (category === 'Car' || category === 'Auto') ? 30 : 20;
            if(!unlocked.includes(postId)) {
                if(confirm(`Unlock contact details for ₹${unlockFee}?`)) {
                    unlocked.push(postId);
                    localStorage.setItem('quilon_unlocked', JSON.stringify(unlocked));
                    filterPosts();
                }
            }
        }

        function filterPosts() {
            let posts = JSON.parse(localStorage.getItem('quilon_posts')) || [];
            const thirtyDaysInMillis = 30 * 24 * 60 * 60 * 1000;
            const currentTime = new Date().getTime();
            posts = posts.filter(p => (currentTime - (p.date || 0)) < thirtyDaysInMillis);
            localStorage.setItem('quilon_posts', JSON.stringify(posts));

            let favorites = JSON.parse(localStorage.getItem('quilon_favorites')) || [];
            let unlocked = JSON.parse(localStorage.getItem('quilon_unlocked')) || [];

            const searchTxt = document.getElementById('searchInput').value.toLowerCase();
            const catFilter = document.getElementById('categoryFilter').value;
            const fuelFilter = document.getElementById('fuelFilter').value;
            const priceFilter = document.getElementById('priceFilter').value;
            const locFilter = document.getElementById('locationFilter').value.toLowerCase();
            const lang = document.getElementById('languageSelect').value;
            const t = translations[lang] || translations.en;

            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            let filtered = posts.filter(p => {
                let matchesSearch = p.title.toLowerCase().includes(searchTxt) || p.category.toLowerCase().includes(searchTxt);
                let matchesCat = catFilter === "" || p.category === catFilter;
                let matchesFuel = fuelFilter === "" || p.fuel === fuelFilter;
                let matchesLoc = locFilter === "" || (p.location && p.location.toLowerCase().includes(locFilter));
                
                let matchesPrice = true;
                if(priceFilter === '20k') matchesPrice = p.price <= 20000;
                else if(priceFilter === '1lakh') matchesPrice = p.price <= 100000;
                else if(priceFilter === '5lakhs') matchesPrice = p.price <= 500000;

                return matchesSearch && matchesCat && matchesFuel && matchesPrice && matchesLoc;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<p style='grid-column: 1/-1; text-align: center; color: #333; font-weight: bold;'>${t.noPosts}</p>`;
                return;
            }

            filtered.forEach(p => {
                const isFav = favorites.includes(p.id);
                const isUnlocked = unlocked.includes(p.id);
                const unlockFee = (p.category === 'Car' || p.category === 'Auto') ? 30 : 20;

                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <button class="fav-btn" onclick="toggleFavorite(${p.id})">${isFav ? '❤️' : '🤍'}</button>
                    ${p.image ? `<img src="${p.image}" alt="Vehicle Image">` : ''}
                    <h3>${p.title}</h3>
                    <p><b>${t.categoryLabel}:</b> ${p.category} | <b>${t.fuelLabel}:</b> ${p.fuel ? p.fuel.toUpperCase() : 'N/A'}</p>
                    <p class="price">₹ ${p.price}</p>
                    <p>📍 <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.location || '')}" target="_blank" style="color: #047857; text-decoration: none; font-weight: bold;">
                        ${p.location || ''} (${t.mapText})
                    </a></p>
                    <div>
                        ${isUnlocked ? `<p>📞 <b>Contact:</b> ${p.contact}</p>` : `<button onclick="unlockContact(${p.id}, '${p.category}')">${t.unlockBtn} (₹${unlockFee})</button>`}
                    </div>
                    <button class="delete-btn" onclick="deletePost(${p.id})">${t.deleteBtnText}</button>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
