<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quilon Vehicles & Parts</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        header { background: #1b263b; color: white; padding: 15px; text-align: center; }
        .banner img { width: 100%; max-height: 200px; object-fit: cover; }
        .menu { display: flex; justify-content: space-around; background: #415a77; padding: 10px; flex-wrap: wrap; }
        .menu a { color: white; text-decoration: none; font-weight: bold; cursor: pointer; padding: 5px 10px; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .filters, .form-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #e0a96d; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #c68b59; }
        .post-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .post-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 15px; position: relative; }
        .post-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .price { color: #2a9d8f; font-size: 18px; font-weight: bold; }
        .fav-btn { position: absolute; top: 20px; right: 20px; background: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
        .suggestion-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; max-height: 150px; overflow-y: auto; z-index: 1000; border-radius: 0 0 5px 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <header>
        <h1>Quilon Vehicles & Parts</h1>
        <p id="tagline">Buy & Sell Cars, Bikes, and Body Parts in Kollam</p>
    </header>

    <!-- Banner Image -->
    <div class="banner">
        <img src="1000232744.png" alt="Banner" onerror="this.style.display='none'">
    </div>

    <!-- Multi-Language Menu -->
    <div class="menu">
        <a onclick="setLanguage('ml')">മലയാളം</a>
        <a onclick="setLanguage('en')">English</a>
        <a onclick="setLanguage('hi')">हिन्दी</a>
        <a onclick="setLanguage('ta')">தமிழ்</a>
        <a onclick="setLanguage('kn')">ಕನ್ನಡ</a>
        <a onclick="setLanguage('bn')">বাংলা</a>
    </div>

    <div class="container">
        <!-- Search & Filters -->
        <div class="filters">
            <h3 id="txtSearchFilter">Search & Filter</h3>
            <input type="text" id="searchInput" placeholder="Search vehicles or parts..." onkeyup="filterPosts()">
            
            <select id="categoryFilter" onchange="filterPosts()">
                <option value="">All Categories</option>
                <option value="Bike">Bikes</option>
                <option value="Car">Cars</option>
                <option value="Auto">Autos</option>
                <option value="Part">Body Parts</option>
            </select>

            <select id="fuelFilter" onchange="filterPosts()">
                <option value="">All Fuel Types (Petrol/Diesel/EV)</option>
                <option value="petrol">Petrol</option>
                <option value="diesel">Diesel</option>
                <option value="ev">Electric (EV)</option>
                <option value="cng">CNG</option>
            </select>

            <select id="priceFilter" onchange="filterPosts()">
                <option value="">All Prices</option>
                <option value="20k">Under ₹20,000</option>
                <option value="1lakh">Under ₹1 Lakh</option>
                <option value="5lakhs">Under ₹5 Lakhs</option>
            </select>

            <!-- Location Filter with Auto-suggestions -->
            <div style="position: relative; display: inline-block; width: 100%;">
                <input type="text" id="locationFilter" placeholder="Filter by Location (e.g. Pathanapuram, Kollam)" onkeyup="showLocationSuggestions()" autocomplete="off">
                <div id="locationSuggestions" class="suggestion-box"></div>
            </div>
        </div>

        <!-- Post New Ad Form -->
        <div class="form-container">
            <h3 id="txtPostAd">Post Your Ad</h3>
            <input type="text" id="postTitle" placeholder="Vehicle / Part Name">
            
            <select id="postCategory" onchange="updateFeesText()">
                <option value="Bike">Bike (Posting Fee: ₹20)</option>
                <option value="Car">Car (Posting Fee: ₹20)</option>
                <option value="Auto">Auto (Posting Fee: ₹30)</option>
                <option value="Part">Body Part (Posting Fee: ₹20)</option>
            </select>

            <select id="postFuel">
                <option value="petrol">Petrol</option>
                <option value="diesel">Diesel</option>
                <option value="ev">Electric (EV)</option>
                <option value="cng">CNG</option>
            </select>

            <input type="number" id="postPrice" placeholder="Price in ₹">
            
            <!-- Post Location with Auto-suggestions -->
            <div style="position: relative; display: inline-block; width: 100%;">
                <input type="text" id="postLocation" placeholder="Location (e.g. Pathanapuram)" onkeyup="showPostLocationSuggestions()" autocomplete="off">
                <div id="postLocationSuggestions" class="suggestion-box"></div>
            </div>

            <input type="file" id="postImage" accept="image/*">
            <textarea id="postContact" placeholder="Contact Details"></textarea>
            <button onclick="submitPost()" id="btnSubmit">Publish Ad (Pay ₹20)</button>
        </div>

        <!-- Posts Display Area -->
        <h2 id="txtRecentPosts">Latest Posts</h2>
        <div class="post-grid" id="postsContainer"></div>
    </div>

    <script>
        // Kollam Locations List (Alphabetical order)
        const kollamLocations = [
            "Anchal", "Chadayamangalam", "Kadavoor", "Kallumkadavu", "Kollam", 
            "Kottarakkara", "Kundara", "Nedumparambu", "Pathanapuram", "Punalur", "Sasthamcotta"
        ].sort();

        function showLocationSuggestions() {
            const inputField = document.getElementById('locationFilter');
            const inputVal = inputField.value.toLowerCase();
            const suggestionBox = document.getElementById('locationSuggestions');
            suggestionBox.innerHTML = '';

            if (inputVal.length === 0) {
                filterPosts();
                return;
            }

            const matches = kollamLocations.filter(item => item.toLowerCase().includes(inputVal));

            matches.forEach(place => {
                const div = document.createElement('div');
                div.style.padding = '10px';
                div.style.cursor = 'pointer';
                div.style.borderBottom = '1px solid #eee';
                div.innerText = place;

                div.onclick = function() {
                    inputField.value = place;
                    suggestionBox.innerHTML = '';
                    filterPosts();
                };

                div.onmouseover = function() { div.style.background = '#f2f2f2'; };
                div.onmouseout = function() { div.style.background = 'white'; };

                suggestionBox.appendChild(div);
            });
            filterPosts();
        }

        function showPostLocationSuggestions() {
            const inputField = document.getElementById('postLocation');
            const inputVal = inputField.value.toLowerCase();
            const suggestionBox = document.getElementById('postLocationSuggestions');
            suggestionBox.innerHTML = '';

            if (inputVal.length === 0) return;

            const matches = kollamLocations.filter(item => item.toLowerCase().includes(inputVal));

            matches.forEach(place => {
                const div = document.createElement('div');
                div.style.padding = '10px';
                div.style.cursor = 'pointer';
                div.style.borderBottom = '1px solid #eee';
                div.innerText = place;

                div.onclick = function() {
                    inputField.value = place;
                    suggestionBox.innerHTML = '';
                };

                div.onmouseover = function() { div.style.background = '#f2f2f2'; };
                div.onmouseout = function() { div.style.background = 'white'; };

                suggestionBox.appendChild(div);
            });
        }

        function updateFeesText() {
            const cat = document.getElementById('postCategory').value;
            const btn = document.getElementById('btnSubmit');
            if(cat === 'Auto') {
                btn.innerText = "Publish Ad (Pay ₹30)";
            } else {
                btn.innerText = "Publish Ad (Pay ₹20)";
            }
        }

        // Translations Dictionary
        const translations = {
            en: { tagline: "Buy & Sell Cars, Bikes, and Body Parts in Kollam", searchFilter: "Search & Filter", recentPosts: "Latest Posts" },
            ml: { tagline: "കൊല്ലത്ത് കാറുകളും ബൈക്കുകളും സ്പെയർ പാർട്സുകളും വാങ്ങാനും വിൽക്കാനും", searchFilter: "സെർച്ചും ഫിൽട്ടറും", recentPosts: "ഏറ്റവും പുതിയ പോസ്റ്റുകൾ" }
        };

        function setLanguage(lang) {
            localStorage.setItem('quilon_lang', lang);
            document.getElementById('tagline').innerText = translations[lang] ? translations[lang].tagline : translations['en'].tagline;
            document.getElementById('txtSearchFilter').innerText = translations[lang] ? translations[lang].searchFilter : translations['en'].searchFilter;
            document.getElementById('txtRecentPosts').innerText = translations[lang] ? translations[lang].recentPosts : translations['en'].recentPosts;
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('quilon_lang') || 'ml';
            setLanguage(savedLang);
            loadPosts();
        };

        function submitPost() {
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('postCategory').value;
            const fuel = document.getElementById('postFuel').value;
            const price = Number(document.getElementById('postPrice').value);
            const location = document.getElementById('postLocation').value;
            const contact = document.getElementById('postContact').value;
            const imageInput = document.getElementById('postImage');

            if(!title || !price || !location) {
                alert("Please fill all required fields!");
                return;
            }

            let postFee = (category === 'Auto') ? 30 : 20;

            const reader = new FileReader();
            if(imageInput.files && imageInput.files[0]) {
                reader.readAsDataURL(imageInput.files[0]);
                reader.onload = function(e) {
                    savePostData(title, category, fuel, price, location, contact, e.target.result, postFee);
                }
            } else {
                savePostData(title, category, fuel, price, location, contact, '', postFee);
            }
        }

        function savePostData(title, category, fuel, price, location, contact, image, postFee) {
            let posts = JSON.parse(localStorage.getItem('quilon_posts')) || [];
            const newPost = {
                id: Date.now(),
                title, category, fuel, price, location, contact, image,
                date: new Date().getTime() // 30 ദിവസ കാലാവധിക്ക് കണക്കാക്കാൻ
            };
            posts.unshift(newPost);
            localStorage.setItem('quilon_posts', JSON.stringify(posts));
            alert(`Payment simulated: ₹${postFee} deducted. Ad Posted Successfully!`);
            location.reload();
        }

        function toggleFavorite(postId) {
            let favorites = JSON.parse(localStorage.getItem('quilon_favorites')) || [];
            const index = favorites.indexOf(postId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(postId);
            }
            localStorage.setItem('quilon_favorites', JSON.stringify(favorites));
            filterPosts();
        }

        function unlockContact(postId, category) {
            let unlocked = JSON.parse(localStorage.getItem('quilon_unlocked')) || [];
            let unlockFee = (category === 'Car' || category === 'Auto') ? 30 : 20;

            if(!unlocked.includes(postId)) {
                if(confirm(`Unlock contact details for ₹${unlockFee}?`)) {
                    unlocked.push(postId);
                    localStorage.setItem('quilon_unlocked', JSON.stringify(unlocked));
                    alert(`Payment simulated: ₹${unlockFee} deducted.`);
                    filterPosts();
                }
            }
        }

        function loadPosts() {
            filterPosts();
        }

        function filterPosts() {
            let posts = JSON.parse(localStorage.getItem('quilon_posts')) || [];
            
            // 30 ദിവസത്തിൽ കൂടുതൽ പഴക്കമുള്ള പോസ്റ്റുകൾ ഓട്ടോമാറ്റിക്കായി നീക്കം ചെയ്യുന്നു
            const thirtyDaysInMillis = 30 * 24 * 60 * 60 * 1000;
            const currentTime = new Date().getTime();
            
            posts = posts.filter(p => (currentTime - (p.date || 0)) < thirtyDaysInMillis);
            localStorage.setItem('quilon_posts', JSON.stringify(posts));

            let favorites = JSON.parse(localStorage.getItem('quilon_favorites')) || [];
            let unlocked = JSON.parse(localStorage.getItem('quilon_unlocked')) || [];

            const searchTxt = document.getElementById('searchInput').value.toLowerCase();
            const catFilter = document.getElementById('categoryFilter').value;
            const fuelFilter = document.getElementById('fuelFilter').value;
            const priceFilter = document.getElementById('priceFilter').value;
            const locFilter = document.getElementById('locationFilter').value.toLowerCase();

            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            let filtered = posts.filter(p => {
                let matchesSearch = p.title.toLowerCase().includes(searchTxt);
                let matchesCat = catFilter === "" || p.category === catFilter;
                let matchesFuel = fuelFilter === "" || p.fuel === fuelFilter;
                let matchesLoc = locFilter === "" || p.location.toLowerCase().includes(locFilter);
                
                let matchesPrice = true;
                if(priceFilter === '20k') matchesPrice = p.price <= 20000;
                else if(priceFilter === '1lakh') matchesPrice = p.price <= 100000;
                else if(priceFilter === '5lakhs') matchesPrice = p.price <= 500000;

                return matchesSearch && matchesCat && matchesFuel && matchesPrice && matchesLoc;
            });

            if(filtered.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #777;'>No posts found. Be the first one to post!</p>";
                return;
            }

            filtered.forEach(p => {
                const isFav = favorites.includes(p.id);
                const isUnlocked = unlocked.includes(p.id);
                const unlockFee = (p.category === 'Car' || p.category === 'Auto') ? 30 : 20;

                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <button class="fav-btn" onclick="toggleFavorite(${p.id})">${isFav ? '❤️' : '🤍'}</button>
                    ${p.image ? `<img src="${p.image}" alt="Image">` : ''}
                    <h3>${p.title}</h3>
                    <p><b>Category:</b> ${p.category} | <b>Fuel:</b> ${p.fuel ? p.fuel.toUpperCase() : 'N/A'}</p>
                    <p class="price">₹ ${p.price}</p>
                    <p>📍 <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.location)}" target="_blank" style="color: #2a9d8f; text-decoration: none; font-weight: bold;">
                        ${p.location} (Map-ൽ കാണുക)
                    </a></p>
                    <div>
                        ${isUnlocked ? `<p>📞 <b>Contact:</b> ${p.contact}</p>` : `<button onclick="unlockContact(${p.id}, '${p.category}')">Unlock Contact (₹${unlockFee})</button>`}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
